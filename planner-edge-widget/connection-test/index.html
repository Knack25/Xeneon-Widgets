<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planner Edge Connection Test</title>
  <link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
  <style>
    :root{font-family:"Segoe UI",system-ui,sans-serif;color:#f4faf9;background:#101a20}
    *{box-sizing:border-box}body{margin:0}main{min-height:100vh;padding:24px 30px}
    h1{font-size:26px;margin:0 0 8px}p{font-size:16px;color:#a4b4b7;margin:0 0 20px}
    dl{display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px 18px;font-size:18px;margin:0 0 22px}
    dt{color:#a4b4b7}dd{margin:0;overflow-wrap:anywhere}
    button{font:inherit;font-size:16px;padding:9px 18px;border:1px solid #59d2b5;border-radius:4px;background:#167862;color:white;cursor:pointer}
    button:disabled{opacity:.55}button:focus-visible{outline:3px solid #73e8ca;outline-offset:2px}
    @media(max-width:540px){main{padding:16px}dl{grid-template-columns:1fr;gap:4px}dd{margin-bottom:10px}}
  </style>
</head>
<body>
  <main>
    <h1>Planner connection test</h1>
    <p>Local helper health check. No Planner tasks are read or changed.</p>
    <dl>
      <dt>Standard request</dt><dd id="cors-result">Checking...</dd>
      <dt>Opaque request</dt><dd id="opaque-result">Waiting...</dd>
    </dl>
    <button id="retry" type="button">Retry</button>
  </main>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Outlook Edge Widget</title>
  <link rel="icon" href="resources/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <main id="app"><p>Loading Outlook...</p></main>
  <script>
    window.icueEvents = Object.assign({}, window.icueEvents, {
      onICUEInitialized: function () { window.dispatchEvent(new Event('outlook-icue-ready')); }
    });
  </script>
  <script src="assets/app.js" defer="defer"></script>
</body>
</html>
